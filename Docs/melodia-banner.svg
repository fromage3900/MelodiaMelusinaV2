<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Melodia Melusina — a single-author rhythm-JRPG. Music is the key.">
  <defs>
    <radialGradient id="void" cx="50%" cy="62%" r="78%">
      <stop offset="0%" stop-color="#12183A"/>
      <stop offset="55%" stop-color="#0A0E22"/>
      <stop offset="100%" stop-color="#05060F"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9CE94"/>
      <stop offset="100%" stop-color="#C9A86A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2.2"/></filter>

    <!-- a single note glyph we reuse -->
    <g id="note">
      <ellipse cx="0" cy="14" rx="9.5" ry="7" transform="rotate(-20)"/>
      <rect x="8" y="-22" width="3.2" height="36" rx="1.6"/>
      <path d="M11.2 -22 q14 4 8 22 q2 -14 -8 -16 z"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#void)"/>

  <!-- faint starfield -->
  <g fill="#FFF8EE">
    <circle cx="180" cy="120" r="1.1" opacity="0.35"/>
    <circle cx="300" cy="80" r="0.9" opacity="0.25"/>
    <circle cx="520" cy="140" r="1.2" opacity="0.30"/>
    <circle cx="760" cy="90" r="0.8" opacity="0.22"/>
    <circle cx="980" cy="150" r="1.1" opacity="0.30"/>
    <circle cx="1120" cy="100" r="0.9" opacity="0.24"/>
    <circle cx="240" cy="520" r="0.9" opacity="0.20"/>
    <circle cx="1080" cy="540" r="1.0" opacity="0.22"/>
    <circle cx="620" cy="560" r="0.8" opacity="0.18"/>
    <circle cx="430" cy="60" r="0.7" opacity="0.18"/>
  </g>

  <!-- the musical staff: five living gold lines across the middle -->
  <g stroke="url(#goldGrad)" stroke-width="1.4" opacity="0.34">
    <line x1="60" y1="300" x2="1220" y2="300"/>
    <line x1="60" y1="330" x2="1220" y2="330"/>
    <line x1="60" y1="360" x2="1220" y2="360"/>
    <line x1="60" y1="390" x2="1220" y2="390"/>
    <line x1="60" y1="420" x2="1220" y2="420"/>
  </g>
  <!-- soft horizon glow under the staff -->
  <rect x="0" y="430" width="1280" height="120" fill="url(#glowGrad)"/>

  <!-- a clef-ish flourish (gold, drawn, not a logo) -->
  <g filter="url(#soft)" stroke="#C9A86A" stroke-width="3.4" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M96 470 C 60 430, 70 350, 120 360 C 150 366, 142 420, 112 418 C 92 416, 100 372, 124 384"/>
    <circle cx="118" cy="452" r="6.5" fill="#C9A86A" stroke="none"/>
  </g>

  <!-- traveling notes in palette colors, hitting the playhead -->
  <g filter="url(#blur2)">
    <use href="#note" x="250" y="300" fill="#5BD6E0"/>
    <use href="#note" x="470" y="360" fill="#FFB7C5"/>
    <use href="#note" x="690" y="330" fill="#A78BFA"/>
    <use href="#note" x="900" y="390" fill="#C9A86A"/>
    <use href="#note" x="1060" y="300" fill="#34D399"/>
  </g>
  <!-- a few little sparkle notes floating -->
  <g opacity="0.5">
    <use href="#note" x="540" y="240" fill="#FFF8EE" transform="scale(0.7)" transform-origin="540 240"/>
    <use href="#note" x="820" y="470" fill="#5BD6E0" transform="scale(0.6)" transform-origin="820 470"/>
    <use href="#note" x="360" y="500" fill="#FFB7C5" transform="scale(0.55)" transform-origin="360 500"/>
  </g>

  <!-- the playhead: a glowing vertical gold line the notes converge on -->
  <g>
    <line x1="980" y1="120" x2="980" y2="500" stroke="url(#goldGrad)" stroke-width="2.6" opacity="0.9" filter="url(#soft)"/>
    <circle cx="980" cy="360" r="9" fill="#FFF8EE" opacity="0.9" filter="url(#soft)"/>
    <circle cx="980" cy="360" r="20" fill="none" stroke="#C9A86A" stroke-width="1.4" opacity="0.45"/>
  </g>

  <!-- title block -->
  <text x="96" y="150" font-family="'Syne','Inter',sans-serif" font-weight="800" font-size="74" letter-spacing="1" fill="#FFF8EE">MEL<tspan fill="#C9A86A">O</tspan>DIA</text>
  <text x="100" y="196" font-family="'Syne','Inter',sans-serif" font-weight="600" font-size="26" fill="#C9A86A" letter-spacing="6">M E L U S I N A</text>

  <text x="100" y="560" font-family="'Inter',sans-serif" font-weight="400" font-size="23" fill="#FFF8EE" opacity="0.92">A single-author rhythm-JRPG in Unreal Engine 5.8.</text>
  <text x="100" y="592" font-family="'Inter',sans-serif" font-weight="400" font-size="19" fill="#94a3b8">Music is the key — rhythm rides on every command. Built in UE5.8 + Blender 5.2.</text>

  <!-- tiny musical signature -->
  <text x="1184" y="600" text-anchor="end" font-family="'Inter',sans-serif" font-size="15" fill="#5BD6E0" opacity="0.8">♪ ✧ ⋆ ┊ a one-person orchestra ┊ ⋆ ✧ ♪</text>
</svg>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071018"/><stop offset="1" stop-color="#11152a"/></linearGradient>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eef4ff}.h{font-size:42px;font-weight:700}.s{font-size:18px;fill:#9fb1c7}.b{font-size:21px;font-weight:700}.m{font-size:16px;fill:#d8e1ee}.sm{font-size:14px;fill:#9fb1c7}.box{rx:18;ry:18;stroke-width:2}.arrow{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#a)}.arrow2{stroke:#c084fc;stroke-width:3;fill:none;marker-end:url(#a2)}

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-label="Melodia Melusina system architecture">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C9A86A"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 700 22px 'Inter', sans-serif; fill: #FFF8EE; }
      .box   { font: 600 15px 'Inter', sans-serif; }
      .sub   { font: 400 10.5px 'Inter', sans-serif; fill: #94a3b8; }
      .cap   { font: 400 11px 'Inter', sans-serif; fill: #94a3b8; font-style: italic; }
      .legend{ font: 500 11px 'Inter', sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#0A0E22"/>
  <rect width="1000" height="680" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="44" class="title">Melodia Melusina — System Architecture</text>
  <text x="40" y="64" class="cap">A single-author rhythm-JRPG. Four pillars converge onto two authority layers.</text>

  <!-- ===== ABSOLUTE AUTHORITY band ===== -->
  <text x="40" y="104" class="box" fill="#C9A86A">ABSOLUTE AUTHORITY</text>
  <text x="40" y="120" class="cap">never rebuilt, wrapped, or competed with</text>

  <rect x="40" y="130" width="430" height="84" rx="6" fill="rgba(201,168,106,0.10)" stroke="#C9A86A" stroke-width="1.5"/>
  <text x="60" y="162" class="box" fill="#FFF8EE">QuillScript</text>
  <text x="60" y="182" class="sub">narrative · dialogue · 7-verb notifications</text>

  <rect x="530" y="130" width="430" height="84" rx="6" fill="rgba(201,168,106,0.10)" stroke="#C9A86A" stroke-width="1.5"/>
  <text x="550" y="162" class="box" fill="#FFF8EE">TurnBased JRPG template</text>
  <text x="550" y="182" class="sub">party · turns · targeting · damage · results · inventory · saves</text>

  <!-- ===== ORCHESTRA pillars (converge down) ===== -->
  <text x="40" y="252" class="box" fill="#C9A86A">THE ORCHESTRA</text>
  <text x="40" y="268" class="cap">each pillar has exactly ONE owner</text>

  <!-- four pillar boxes -->
  <rect x="40"  y="280" width="210" height="76" rx="6" fill="rgba(91,214,224,0.10)" stroke="#5BD6E0" stroke-width="1.5"/>
  <text x="60" y="312" class="box" fill="#FFF8EE">RHYTHM</text>
  <text x="60" y="332" class="sub">timing layer on JRPG</text>
  <text x="60" y="346" class="sub">command input</text>

  <rect x="270" y="280" width="210" height="76" rx="6" fill="rgba(255,183,197,0.10)" stroke="#FFB7C5" stroke-width="1.5"/>
  <text x="290" y="312" class="box" fill="#FFF8EE">WARDROBE</text>
  <text x="290" y="332" class="sub">outfits: presentation</text>
  <text x="290" y="346" class="sub">+ gameplay meaning</text>

  <rect x="500" y="280" width="210" height="76" rx="6" fill="rgba(167,139,250,0.10)" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="520" y="312" class="box" fill="#FFF8EE">UI</text>
  <text x="520" y="332" class="sub">one writer</text>
  <text x="520" y="346" class="sub">per surface</text>

  <rect x="730" y="280" width="230" height="76" rx="6" fill="rgba(52,211,153,0.10)" stroke="#34D399" stroke-width="1.5"/>
  <text x="750" y="312" class="box" fill="#FFF8EE">WORLD PUZZLE</text>
  <text x="750" y="332" class="sub">music-as-key</text>
  <text x="750" y="346" class="sub">(not yet built)</text>

  <!-- convergence arrows pillar -> authority -->
  <line x1="145" y1="356" x2="255" y2="214" stroke="#5BD6E0" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.8"/>
  <line x1="375" y1="356" x2="265" y2="214" stroke="#FFB7C5" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.8"/>
  <line x1="605" y1="356" x2="765" y2="214" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.8"/>
  <line x1="845" y1="356" x2="775" y2="214" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- ===== SECONDARY model tooling ===== -->
  <rect x="40" y="470" width="300" height="70" rx="6" fill="rgba(148,163,184,0.06)" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="60" y="500" class="box" fill="#cbd5e1">Local model tooling</text>
  <text x="60" y="520" class="sub" fill="#94a3b8">Qwen / Muse — drafting only</text>

  <text x="350" y="510" class="cap">never the product · never sets direction</text>

  <!-- dashed low-emphasis feed arrows from tooling to pillars -->
  <line x1="340" y1="500" x2="375" y2="360" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="340" y1="520" x2="605" y2="360" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="340" y1="535" x2="845" y2="360" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ===== Legend ===== -->
  <g transform="translate(40,600)">
    <rect x="0"   y="0" width="14" height="10" rx="2" fill="rgba(201,168,106,0.2)" stroke="#C9A86A" stroke-width="1"/>
    <text x="20" y="9" class="legend">Authority</text>
    <rect x="120" y="0" width="14" height="10" rx="2" fill="rgba(91,214,224,0.2)" stroke="#5BD6E0" stroke-width="1"/>
    <text x="140" y="9" class="legend">Rhythm</text>
    <rect x="220" y="0" width="14" height="10" rx="2" fill="rgba(255,183,197,0.2)" stroke="#FFB7C5" stroke-width="1"/>
    <text x="240" y="9" class="legend">Wardrobe</text>
    <rect x="340" y="0" width="14" height="10" rx="2" fill="rgba(167,139,250,0.2)" stroke="#A78BFA" stroke-width="1"/>
    <text x="360" y="9" class="legend">UI</text>
    <rect x="410" y="0" width="14" height="10" rx="2" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="1"/>
    <text x="430" y="9" class="legend">World</text>
    <rect x="510" y="0" width="14" height="10" rx="2" fill="rgba(148,163,184,0.08)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="530" y="9" class="legend">Model tooling (secondary)</text>
  </g>
</svg>

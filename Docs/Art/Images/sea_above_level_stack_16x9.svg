<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#06131f"/><stop offset="100%" stop-color="#091a2a"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1c7896"/><stop offset="100%" stop-color="#0f405f"/></linearGradient><linearGradient id="falsewater" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#226d91"/><stop offset="55%" stop-color="#384b96"/><stop offset="100%" stop-color="#5b3c8a"/></linearGradient><linearGradient id="bell" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#492d72" stop-opacity="0.45"/><stop offset="50%" stop-color="#7b5db4" stop-opacity="0.55"/><stop offset="100%" stop-color="#2d6a91" stop-opacity="0.35"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fd3ff"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="60" y="70" fill="#e8f5ff" font-size="42" font-family="Arial" font-weight="700">SEA ABOVE — 16:9 LEVEL LAYER STACK</text><text x="60" y="110" fill="#9fbdd2" font-size="20" font-family="Arial">Real water gameplay above; impossible presentation layers below.</text><rect x="70" y="150" width="1030" height="660" rx="14" fill="#0b1d2b" stroke="#2e607d" stroke-width="2"/><rect x="110" y="185" width="950" height="105" rx="8" fill="#17354b"/><text x="135" y="225" fill="#e8f5ff" font-size="26" font-family="Arial" font-weight="700">SKY / ATMOSPHERE</text><text x="135" y="258" fill="#a9c6d8" font-size="18" font-family="Arial">Existing sky / lighting stack. No Sea Above authority.</text><rect x="110" y="300" width="950" height="105" rx="8" fill="url(#water)" stroke="#66c9f0" stroke-width="2"/><text x="135" y="335" fill="#fff" font-size="26" font-family="Arial" font-weight="700">REAL OCEAN — GAMEPLAY WATER AUTHORITY</text><text x="135" y="372" fill="#d7f7ff" font-size="18" font-family="Arial">MI_SeaAbove_SurfaceOcean → M_Water_Master_Grand_v10_Upgrade</text><text x="135" y="396" fill="#d7f7ff" font-size="16" font-family="Arial">UMelodiaWaterInteractionSubsystem may query this surface.</text><rect x="110" y="415" width="950" height="95" rx="8" fill="#13263a" stroke="#526e84" stroke-width="2" stroke-dasharray="8 8"/><text x="135" y="452" fill="#e8f5ff" font-size="25" font-family="Arial" font-weight="700">ATMOSPHERIC DEPTH GAP</text><text x="135" y="483" fill="#adc5d4" font-size="18" font-family="Arial">Fog / volumetric haze hides literal spacing and makes depth unreadable.</text><rect x="110" y="520" width="950" height="110" rx="8" fill="url(#falsewater)" stroke="#9c87e8" stroke-width="2"/><text x="135" y="555" fill="#fff" font-size="26" font-family="Arial" font-weight="700">FALSE OCEAN — PRESENTATION ONLY</text><text x="135" y="590" fill="#efeaff" font-size="18" font-family="Arial">MI_SeaAbove_FalseOcean → same V10 master; NativeWaterAvailability = 0.</text><text x="135" y="615" fill="#efeaff" font-size="16" font-family="Arial">Never registered or queried as gameplay water.</text><path d="M210 765 Q585 580 960 765 L960 792 L210 792 Z" fill="url(#bell)" stroke="#b79ae8" stroke-width="3"/><path d="M330 760 Q585 630 840 760" fill="none" stroke="#c2a7ff" stroke-width="3" opacity="0.65"/><text x="135" y="700" fill="#f1eaff" font-size="26" font-family="Arial" font-weight="700">THE BELL — IMPLIED BIOLOGY</text><text x="135" y="730" fill="#d8c9f7" font-size="18" font-family="Arial">Sphere/hemisphere + M_SeaAbove_Membrane_Prototype. Hide perimeter; reveal radial anatomy on pulse.</text><circle cx="720" cy="265" r="12" fill="#f4dc9a"/><line x1="732" y1="285" x2="820" y2="610" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/><text x="748" y="274" fill="#f4dc9a" font-size="17" font-family="Arial">Hero camera / player overlook</text><rect x="1140" y="150" width="390" height="660" rx="14" fill="#0b1d2b" stroke="#2e607d" stroke-width="2"/><text x="1170" y="195" fill="#e8f5ff" font-size="28" font-family="Arial" font-weight="700">PROTOTYPE RULES</text><text x="1170" y="235" fill="#9fd7c9" font-size="18" font-family="Arial">✓ Real ocean = existing Water V10</text><text x="1170" y="268" fill="#9fd7c9" font-size="18" font-family="Arial">✓ False ocean = static presentation plane</text><text x="1170" y="301" fill="#9fd7c9" font-size="18" font-family="Arial">✓ Bell = separate membrane material</text><text x="1170" y="334" fill="#9fd7c9" font-size="18" font-family="Arial">✓ Fog creates impossible scale</text><text x="1170" y="367" fill="#9fd7c9" font-size="18" font-family="Arial">✓ 20–30 s hero proof first</text><text x="1170" y="425" fill="#ffb0b0" font-size="22" font-family="Arial" font-weight="700">DO NOT DO TONIGHT</text><text x="1170" y="462" fill="#f3c3c3" font-size="17" font-family="Arial">× No V11 / master rewrite</text><text x="1170" y="493" fill="#f3c3c3" font-size="17" font-family="Arial">× No second Water Body / Water Zone</text><text x="1170" y="524" fill="#f3c3c3" font-size="17" font-family="Arial">× No FLIP / NDC consumer work</text><text x="1170" y="555" fill="#f3c3c3" font-size="17" font-family="Arial">× No new C++</text><text x="1170" y="586" fill="#f3c3c3" font-size="17" font-family="Arial">× No World Partition changes</text><text x="1170" y="617" fill="#f3c3c3" font-size="17" font-family="Arial">× No full creature rig/model</text><text x="1170" y="675" fill="#e8f5ff" font-size="22" font-family="Arial" font-weight="700">REVEAL ORDER</text><text x="1170" y="710" fill="#bfd4e2" font-size="17" font-family="Arial">1. Normal coast</text><text x="1170" y="738" fill="#bfd4e2" font-size="17" font-family="Arial">2. Second horizon</text><text x="1170" y="766" fill="#bfd4e2" font-size="17" font-family="Arial">3. Bell pulse → anatomy</text><text x="1170" y="794" fill="#bfd4e2" font-size="17" font-family="Arial">4. Biological realization</text></svg>
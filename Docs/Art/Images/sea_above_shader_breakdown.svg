<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#06131f"/><stop offset="100%" stop-color="#091a2a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fd3ff"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="60" y="70" fill="#e8f5ff" font-size="42" font-family="Arial" font-weight="700">SEA ABOVE — SHADER & MATERIAL BREAKDOWN</text><text x="60" y="110" fill="#9fbdd2" font-size="20" font-family="Arial">Water V10 stays production authority; the creature gets a separate local membrane shader.</text><rect x="60" y="150" width="350" height="650" rx="14" fill="#10283a" stroke="#57b5d9" stroke-width="2"/><text x="85" y="190" fill="#fff" font-size="26" font-family="Arial" font-weight="700">1. REAL OCEAN</text><text x="85" y="220" fill="#a9dcec" font-size="16" font-family="Arial">MI_SeaAbove_SurfaceOcean</text><text x="85" y="245" fill="#a9dcec" font-size="15" font-family="Arial">Duplicate from integrated CalmPond</text><rect x="90" y="280" width="290" height="88" rx="10" fill="#183d59"/><text x="110" y="315" fill="#eaf8ff" font-size="18" font-family="Arial" font-weight="700">M_Water_Master_Grand_v10_Upgrade</text><text x="110" y="343" fill="#c5e7f5" font-size="15" font-family="Arial">DO NOT MODIFY</text><text x="85" y="410" fill="#e8f5ff" font-size="19" font-family="Arial" font-weight="700">Look target</text><text x="95" y="445" fill="#bfd7e6" font-size="16" font-family="Arial">• calm readable surface</text><text x="95" y="474" fill="#bfd7e6" font-size="16" font-family="Arial">• restrained foam / ripple</text><text x="95" y="503" fill="#bfd7e6" font-size="16" font-family="Arial">• low visible biolum at rest</text><text x="95" y="532" fill="#bfd7e6" font-size="16" font-family="Arial">• World UV behavior preserved</text><text x="95" y="561" fill="#bfd7e6" font-size="16" font-family="Arial">• gameplay water authority</text><text x="85" y="620" fill="#9fd7c9" font-size="18" font-family="Arial" font-weight="700">Existing system</text><text x="95" y="652" fill="#c5eee4" font-size="16" font-family="Arial">UMelodiaWaterInteractionSubsystem</text><text x="95" y="681" fill="#c5eee4" font-size="16" font-family="Arial">may query/contact this layer.</text><text x="95" y="730" fill="#ffd0d0" font-size="16" font-family="Arial">No SceneDepth experiment.</text><text x="95" y="758" fill="#ffd0d0" font-size="16" font-family="Arial">No refraction dependency.</text><rect x="440" y="150" width="350" height="650" rx="14" fill="#202548" stroke="#9486e0" stroke-width="2"/><text x="465" y="190" fill="#fff" font-size="26" font-family="Arial" font-weight="700">2. FALSE OCEAN</text><text x="465" y="220" fill="#d4cfff" font-size="16" font-family="Arial">MI_SeaAbove_FalseOcean</text><text x="465" y="245" fill="#d4cfff" font-size="15" font-family="Arial">Duplicate from CinematicHero</text><rect x="470" y="280" width="290" height="88" rx="10" fill="#343064"/><text x="490" y="315" fill="#fff" font-size="18" font-family="Arial" font-weight="700">Same V10 master</text><text x="490" y="343" fill="#e6dcff" font-size="15" font-family="Arial">presentation plane only</text><text x="465" y="410" fill="#f0ebff" font-size="19" font-family="Arial" font-weight="700">Starting deltas</text><text x="475" y="445" fill="#ddd7ff" font-size="16" font-family="Arial">• NativeWaterAvailability = 0</text><text x="475" y="474" fill="#ddd7ff" font-size="16" font-family="Arial">• WaterV10WorldUVBlend = 1</text><text x="475" y="503" fill="#ddd7ff" font-size="16" font-family="Arial">• WorldTextureScale ≈ 0.0012</text><text x="475" y="532" fill="#ddd7ff" font-size="16" font-family="Arial">• reduce foam aggressively</text><text x="475" y="561" fill="#ddd7ff" font-size="16" font-family="Arial">• slow cyan-violet motion</text><text x="475" y="590" fill="#ddd7ff" font-size="16" font-family="Arial">• retain controlled biolum</text><text x="465" y="640" fill="#c2a7ff" font-size="18" font-family="Arial" font-weight="700">Local runtime hook</text><text x="475" y="672" fill="#e6dcff" font-size="16" font-family="Arial">Director creates MID and lifts</text><text x="475" y="701" fill="#e6dcff" font-size="16" font-family="Arial">WaterBioluminescenceImpulse</text><text x="475" y="730" fill="#e6dcff" font-size="16" font-family="Arial">during Bell pulse.</text><text x="475" y="769" fill="#ffc6d0" font-size="16" font-family="Arial">Never register as gameplay water.</text><rect x="820" y="150" width="350" height="650" rx="14" fill="#38284f" stroke="#bd9ce6" stroke-width="2"/><text x="845" y="190" fill="#fff" font-size="26" font-family="Arial" font-weight="700">3. BELL MEMBRANE</text><text x="845" y="220" fill="#eadcff" font-size="16" font-family="Arial">M_SeaAbove_Membrane_Prototype</text><text x="845" y="245" fill="#eadcff" font-size="15" font-family="Arial">Separate material — not Water V10</text><rect x="850" y="285" width="120" height="62" rx="8" fill="#4a3e64"/><text x="877" y="322" fill="#fff" font-size="17" font-family="Arial">Fresnel</text><rect x="850" y="385" width="120" height="62" rx="8" fill="#4a3e64"/><text x="880" y="422" fill="#fff" font-size="17" font-family="Arial">Noise</text><rect x="1005" y="335" width="120" height="62" rx="8" fill="#5d4778"/><text x="1030" y="372" fill="#fff" font-size="17" font-family="Arial">Shape Mix</text><line x1="970" y1="316" x2="1005" y2="352" stroke="#c2a7ff" stroke-width="3" marker-end="url(#arrow)"/><line x1="970" y1="416" x2="1005" y2="380" stroke="#c2a7ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="480" width="170" height="64" rx="8" fill="#704e8c"/><text x="956" y="518" fill="#fff" font-size="17" font-family="Arial">SeaAbovePulse</text><line x1="1015" y1="480" x2="1065" y2="397" stroke="#c2a7ff" stroke-width="3" marker-end="url(#arrow)"/><text x="845" y="595" fill="#f0ebff" font-size="19" font-family="Arial" font-weight="700">Outputs</text><text x="855" y="628" fill="#e3d8f7" font-size="16" font-family="Arial">• Emissive = radial reveal</text><text x="855" y="657" fill="#e3d8f7" font-size="16" font-family="Arial">• Opacity = Fresnel × breakup</text><text x="855" y="686" fill="#e3d8f7" font-size="16" font-family="Arial">• optional subtle WPO</text><text x="855" y="715" fill="#e3d8f7" font-size="16" font-family="Arial">• slow low-frequency noise</text><text x="855" y="744" fill="#e3d8f7" font-size="16" font-family="Arial">• unlit/translucent preferred tonight</text><rect x="1200" y="150" width="340" height="650" rx="14" fill="#16263d" stroke="#6d8fb2" stroke-width="2"/><text x="1225" y="190" fill="#fff" font-size="26" font-family="Arial" font-weight="700">4. UNDER-SKY</text><text x="1225" y="220" fill="#c4d7e8" font-size="16" font-family="Arial">M_SeaAbove_UnderSky_Prototype</text><text x="1225" y="245" fill="#c4d7e8" font-size="15" font-family="Arial">Optional simple unlit dome/card</text><text x="1225" y="300" fill="#e8f5ff" font-size="19" font-family="Arial" font-weight="700">Inputs</text><text x="1235" y="335" fill="#cbdce9" font-size="16" font-family="Arial">• emissive sky gradient</text><text x="1235" y="364" fill="#cbdce9" font-size="16" font-family="Arial">• low-frequency cloud noise</text><text x="1235" y="393" fill="#cbdce9" font-size="16" font-family="Arial">• extremely slow pan</text><text x="1235" y="422" fill="#cbdce9" font-size="16" font-family="Arial">• no gameplay role</text><text x="1225" y="485" fill="#e8f5ff" font-size="19" font-family="Arial" font-weight="700">Purpose</text><text x="1235" y="520" fill="#cbdce9" font-size="16" font-family="Arial">Makes the false ocean read as a</text><text x="1235" y="548" fill="#cbdce9" font-size="16" font-family="Arial">second world before the Bell reveal.</text><text x="1225" y="620" fill="#9fd7c9" font-size="18" font-family="Arial" font-weight="700">Performance rule</text><text x="1235" y="652" fill="#c5eee4" font-size="16" font-family="Arial">Cheap cards / dome first.</text><text x="1235" y="681" fill="#c5eee4" font-size="16" font-family="Arial">No volumetric simulation required.</text><rect x="60" y="825" width="1480" height="45" rx="8" fill="#0f2232" stroke="#36556e" stroke-width="1.5"/><text x="80" y="854" fill="#d4e7f4" font-size="17" font-family="Arial">Authority rule: production Water V10 remains immutable; Sea Above adds instances, local MIDs, presentation geometry and a separate membrane shader.</text></svg>
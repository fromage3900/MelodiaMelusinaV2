      - { name: Melusina_RoseGold, default: [0.85, 0.55, 0.45, 1.0] }
      - { name: Melusina_DeepTeal, default: [0.05, 0.25, 0.30, 1.0] }
      - { name: R1999_Burgundy, default: [0.45, 0.08, 0.10, 1.0] }
      - { name: R1999_Gold, default: [0.85, 0.70, 0.30, 1.0] }
      - { name: R1999_Teal, default: [0.10, 0.35, 0.40, 1.0] }
      - { name: R1999_Navy, default: [0.05, 0.08, 0.18, 1.0] }

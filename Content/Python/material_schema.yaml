# ── Master material schemas ──────────────────────────────────────────
masters:
  M_Master_Toon_Universal:
    path: /Game/EnvSandbox/Materials/Masters/M_Master_Toon_Universal
    toon_profile: TP_Default
    mpc_references:
      - MPC_Melodia_Palette: [GlobalSparkleIntensity, GlobalEmissiveBoost, Melusina_Lavender, Melusina_RoseGold, Melusina_SoftWhite]
    groups:
      - name: "00 Palette"
        params:
          - { name: BaseTint, type: vector, default: [1,1,1,1] }
          - { name: PaletteRampLow, type: vector, default: [0.1,0.05,0.15,1] }
          - { name: PaletteRampMid, type: vector, default: [0.5,0.4,0.5,1] }
          - { name: PaletteRampHigh, type: vector, default: [0.9,0.85,0.8,1] }
          - { name: PaletteRampStrength, type: float, default: 0.0, range: [0,1] }
          - { name: PaletteRampDriver, type: float, default: 0.5, range: [0,1] }
      - name: "01 Surface"
        params:
          - { name: RoughnessScale, type: float, default: 1.0, range: [0,1] }
          - { name: RoughnessBias, type: float, default: 0.0, range: [-1,1] }
          - { name: MetallicScale, type: float, default: 1.0, range: [0,1] }
          - { name: MetallicBias, type: float, default: 0.0, range: [-1,1] }
          - { name: NormalStrength, type: float, default: 1.0, range: [0,2] }

  M_Master_Nikki:
    path: /Game/EnvSandbox/Materials/_Scratch/M_Master_Nikki
    toon_profile: TP_Character
    mpc_references:
      - MPC_Melodia_Palette: [GlobalSparkleIntensity, GlobalEmissiveBoost, R1999_Navy, R1999_Gold, Melusina_SoftWhite, Melusina_Lavender]
    groups:
      - name: "00 Surface"
        params:
          - { name: Roughness, type: float, default: 0.5, range: [0,1] }
          - { name: Metallic, type: float, default: 0.0, range: [0,1] }

  M_PP_MeluColorGrade:
    path: /Game/_PROJECT/04_Materials/PostProcess/M_PP_MeluColorGrade
    custom_hlsl_pins:
      - { name: CelSteps, type: float, default: 0.0, range: [0, 8], group: "V3 Cel-Shading" }
      - { name: DynamicContrast, type: float, default: 0.0, range: [0, 1], group: "V3 Adaptive" }
      - { name: SelectiveStrength, type: float, default: 0.0, range: [0, 1], group: "V3 Adaptive" }
      - { name: KeepColorHue, type: float, default: 0.0, range: [0, 1], group: "V3 Adaptive" }
    mpc_references: []
    groups: []

  M_Universal_Enhanced_Water:
    path: /Game/_PROJECT/04_Materials/Masters/M_Universal_Enhanced_Water
    mpc_references: []
    groups: []

  M_Master_Toon_Landscape_HeightBlend:
    path: /Game/EnvSandbox/Materials/Masters/M_Master_Toon_Landscape_HeightBlend
    toon_profile: TP_Foliage
    mpc_references:
      - MPC_Melodia_Palette: [GlobalSparkleIntensity, GlobalEmissiveBoost, GlobalReactivity, Melusina_Lavender, Melusina_SoftWhite]
    groups: []

# Master Material Parameter Schema — BS_GodFile
# Canonical definition for validation and auto-repair.
# Each master lists every expected parameter, its type, range, group, and default.
---
version: 1
date: 2026-08-04

# ── Toon Profile assignments ──────────────────────────────────────────
# Profiles must be created manually in-editor (no Python API exists yet).
# See TOON_PROFILES_GUIDE.md for creation steps.
# After creation, run: python assign_toon_profiles.py --apply
toon_profiles:
  TP_Character:
    expected_path: /Game/EnvSandbox/Materials/ToonProfiles/TP_Character
    assigned_to: M_Master_Nikki
    diffuse_stops: 3
    specular: narrow
    gi_intensity: 0.3
    hatching: false
  TP_Foliage:
    expected_path: /Game/EnvSandbox/Materials/ToonProfiles/TP_Foliage
    assigned_to: M_Master_Toon_Landscape_HeightBlend
    diffuse_stops: 2
    specular: none
    gi_intensity: 0.8
    hatching: false
  TP_Water:
    expected_path: /Game/EnvSandbox/Materials/ToonProfiles/TP_Water
    assigned_to: M_Universal_Enhanced_Water
    diffuse_stops: 2
    specular: strong
    gi_intensity: 1.0
    hatching: false
  TP_Hero:
    expected_path: /Game/EnvSandbox/Materials/ToonProfiles/TP_Hero
    assigned_to: M_Master_Toon_Universal  # Hero close-ups override
    diffuse_stops: 3
    specular: narrow
    gi_intensity: 0.3
    hatching: true


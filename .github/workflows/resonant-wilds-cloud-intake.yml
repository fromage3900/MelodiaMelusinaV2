name: Resonant Wilds Cloud Intake

on:
  pull_request:
    paths:
      - 'Prototypes/Web/MelodiaResonantWilds/**'
      - '.github/workflows/resonant-wilds-cloud-intake.yml'
  workflow_dispatch:

jobs:
  zero-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check WebGL browser module syntax
        run: |
          for file in Prototypes/Web/MelodiaResonantWilds/js/*.js; do node --check "$file"; done
          node --check Prototypes/Web/MelodiaResonantWilds/sw.js
          node --check Prototypes/Web/MelodiaResonantWilds/vendor/examples/jsm/loaders/GLTFLoader.js
          node --check Prototypes/Web/MelodiaResonantWilds/vendor/examples/jsm/utils/BufferGeometryUtils.js
          for file in Prototypes/Web/MelodiaResonantWilds/vendor/postprocessing/*.js Prototypes/Web/MelodiaResonantWilds/vendor/shaders/*.js; do node --check "$file"; done
      - name: Verify shaders, GLB metadata and offline dependencies
        run: |
          node Prototypes/Web/MelodiaResonantWilds/tools/check_shader_lab.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_cloud_intake.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_bellflower.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_flowerbeds.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_grove_kit.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_ethereal_expansion.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_world_stack.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_grove_integration.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_resonant_botany.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_flower_landscape.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_floraison_pov.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_release_staging.mjs
          node Prototypes/Web/MelodiaResonantWilds/tools/check_crisp_painterly.mjs
      - name: Smoke static asset delivery
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/resonant-wilds-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error -I http://127.0.0.1:8765/Prototypes/Web/MelodiaResonantWilds/index.html
          curl --fail --silent --show-error -I http://127.0.0.1:8765/Prototypes/Web/MelodiaResonantWilds/assets/models/resonance-shrine.glb
          curl --fail --silent --show-error -I http://127.0.0.1:8765/Prototypes/Web/MelodiaResonantWilds/js/asset-loader.js
          curl --fail --silent --show-error -I http://127.0.0.1:8765/Prototypes/Web/MelodiaResonantWilds/js/grove.js
          curl --fail --silent --show-error -I http://127.0.0.1:8765/Prototypes/Web/MelodiaResonantWilds/assets/models/harmonic-grove-37.glb
          curl --fail --silent --show-error -I http://127.0.0.1:8765/Prototypes/Web/MelodiaResonantWilds/sw.js
  headless-webgl:
    needs: zero-dependency-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright only for cloud QA
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start site and test seventeen WebGL states
        env:
          GAME_URL: http://127.0.0.1:8765/Prototypes/Web/MelodiaResonantWilds/
          RW_SCREENSHOT_DIR: /tmp/rw-flowerbed-review
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/resonant-wilds-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p /tmp/rw-flowerbed-review
          node Prototypes/Web/MelodiaResonantWilds/tools/browser_smoke.mjs
      - name: Upload Petal Cantata, Grove and NPR comparison captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw-petal-cantata-flowerbeds
          path: /tmp/rw-flowerbed-review/*.png
          if-no-files-found: warn

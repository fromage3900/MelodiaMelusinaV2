# Runner requirement: this job needs a self-hosted runner labeled
# [self-hosted, Windows, UE58] (a Windows box with UE 5.8 + the Python
# toolchain installed). If no such runner is registered under this repo,
# the job will sit QUEUED indefinitely instead of failing -- GitHub does
# not time out unmatched runner labels. Check Settings > Actions > Runners
# before assuming a stuck job is a workflow bug.
name: Echo Static Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Plugins/**/Source/**'
      - 'Content/Python/**'
      - 'specs/**'
      - 'Tools/**'
      - '.github/workflows/echo_gates.yml'
  workflow_dispatch:

jobs:
  static_gates:
    runs-on: [self-hosted, Windows, UE58]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: LFS pull (Python + specs only)
        shell: powershell
        run: |
          git lfs pull --include="specs/**,Content/Python/**"

      - name: Validate echo manifest
        shell: powershell
        run: |
          python Tools/echo_run.py validate-spec specs/echo_pipeline.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Echo manifest validation failed"
            exit $LASTEXITCODE
          }

      - name: Execute offline contract suites
        shell: powershell
        run: |
          # Do not replace this with `pytest Tools`: nine suites are explicit
          # script runners and pytest is not guaranteed on the UE runner.
          python Tools/run_contract_tests.py --ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Offline contract suite coverage floor failed"
            exit $LASTEXITCODE
          }

      - name: Project health scorecard (offline slice)
        shell: powershell
        run: |
          # Cheap standing claims + MATH harness self-eval + HTML scorecard.
          # Does NOT re-run editor-backed completion gates; those stay ledger history.
          python Tools/health.py --offline
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Offline project health failed"
            exit $LASTEXITCODE
          }

      - name: Static gate sweep (headless)
        shell: powershell
        continue-on-error: false
        run: |
          $ErrorActionPreference = "Continue"
          $failed = 0
          # Each tool below has its own real CLI -- --summary existed only on
          # art_gates.py and exit-2'd the others instantly (2026-08-14).
          # graph_reachability is the gating reachability check (--ci exits 1
          # on EDITOR/connectivity violations).
          python Tools/graph_reachability.py --all-melodia --ci
          if ($LASTEXITCODE -ne 0) { $failed++ }
          # bp_sweep and ui_style_audit are report generators; they always
          # exit 0, so write dashboards and rely on art_gates/bp_sweep JSON
          # finding counts to fail the gate. bp_sweep --json emits findings;
          # a non-empty findings file fails the gate.
          python Tools/bp_sweep.py --json "$env:TEMP\bp_sweep_ci.json"
          if (Test-Path "$env:TEMP\bp_sweep_ci.json") {
            $findings = (Get-Content "$env:TEMP\bp_sweep_ci.json" -Raw | ConvertFrom-Json)
            $bad = @($findings.records | Where-Object { $_.shadowed.Count -gt 0 -or $_.empty_events.Count -gt 0 -or $_.dead.Count -gt 0 })
            if ($bad.Count -gt 0) { $failed++ }
          }
          python Tools/ui_style_audit.py --json "$env:TEMP\ui_audit_ci.json"
          # Art-side gates (added 2026-08-13). Every check above this line is
          # Blueprint or UI; nothing had ever validated a material, mesh, texture or
          # asset name. Offline half only -- naming, duplicate short names, spine
          # hygiene, budget-spec sanity. The shader-instruction budget needs a live
          # editor (--live) and so cannot run here.
          # Baselined: 136 pre-existing violations are accepted debt in
          # specs/art_gates_baseline.json; only NEW violations fail. Run
          # `python Tools/art_gates.py --strict` to see the true state.
          python Tools/art_gates.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          if ($failed -gt 0) {
            Write-Host "##[error]Static gates failed: $failed checks"
            exit 1
          }
          Write-Host "Static gates passed."

      - name: LFS budget gate (PR base..head; 50 MB on collab/cursor)
        shell: powershell
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "origin/main" }
          git fetch origin main --depth=50 2>$null
          $limit = 512
          $ref = "${{ github.head_ref }}"
          if ($ref -match '^(collab|cursor|docs)/') { $limit = 50 }
          python Tools/git_safe_push.py --range "$base..HEAD" --limit-mb $limit --check-only
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]LFS batch exceeds $limit MB budget"
            exit $LASTEXITCODE
          }
          python Tools/lfs_health_audit.py --game-paths-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record gate row (artifact only; do not push from CI)
        shell: powershell
        run: |
          python Tools/record_gate.py static_gates pass --note "CI echo_gates.yml ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path Saved/gate_ledger.json) {
            Write-Host "Ledger updated locally in the runner workspace."
          }

      # Saved/ is gitignored (see .gitignore) so the ledger this step just
      # wrote can never be committed -- and it shouldn't be, it's a CI
      # artifact, not source. Upload it as a workflow artifact instead so
      # release_tag.yml can download the latest one and verify gate rows
      # without needing a committed file or a second write path into git.
      - name: Upload gate ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-ledger
          path: Saved/gate_ledger.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload project health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-health
          path: |
            Saved/Audit/project_health_claims.json
            Saved/Audit/math_run_latest.json
            Saved/project_health.html
          if-no-files-found: warn
          retention-days: 90

name: Echo Static Gates

# The offline job runs on every PR and main push. The editor-backed job is
# manual because it requires the artist's Windows/UE 5.8 machine; leaving a
# self-hosted label on a PR job makes GitHub queue forever when that machine is
# offline.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Plugins/**/Source/**'
      - 'Content/Python/**'
      - 'specs/**'
      - 'Tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_gates:
    name: Offline static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate echo manifest
        run: python Tools/echo_run.py validate-spec specs/echo_pipeline.json

      - name: Execute offline contract suites
        run: python Tools/run_contract_tests.py --offline --ci

      - name: Project health scorecard (offline slice)
        run: python Tools/health.py --offline --json

      - name: Art-side offline gates
        run: python Tools/art_gates.py --summary

      - name: Credits coverage gate
        run: python Tools/credits_gate.py

      - name: LFS budget and pointer gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-}"
          if [[ -z "$base" ]]; then
            git fetch origin main --depth=50
            base="origin/main"
          fi
          limit=512
          # This named recovery branch carries one intentional 579 MB LFS
          # batch; the repository quota is already configured for it. Normal
          # branches retain the 512 MB ceiling.
          if [[ "${HEAD_BRANCH:-}" == "codex/p0-closeout-lfs-2026-09-02" ]]; then
            limit=768
          fi
          if [[ "${HEAD_BRANCH:-}" =~ ^(collab|cursor|docs)/ ]]; then
            limit=50
          fi
          python Tools/git_safe_push.py --range "$base..HEAD" --limit-mb "$limit" --check-only
          python Tools/lfs_health_audit.py --game-paths-only

      - name: Upload offline health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-health
          path: |
            Saved/gate_ledger.json
            Saved/Audit/project_health_claims.json
            Saved/Audit/math_run_latest.json
            Saved/project_health.html
          if-no-files-found: warn
          retention-days: 90

  live_gates:
    name: Editor-backed gates (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, UE58]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: LFS pull for editor-backed probes
        shell: powershell
        run: |
          git lfs pull --include="Content/**,Plugins/**/Content/**"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Blueprint and UI live sweeps
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python Tools/graph_reachability.py --all-melodia --ci
          python Tools/bp_sweep.py --json "$env:TEMP\bp_sweep_live.json"
          python Tools/ui_style_audit.py --json "$env:TEMP\ui_audit_live.json"
          python Tools/art_gates.py --live

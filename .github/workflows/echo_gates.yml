name: Echo Static Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Plugins/**/Source/**'
      - 'Content/Python/**'
      - 'specs/**'
  workflow_dispatch:

jobs:
  static_gates:
    runs-on: [self-hosted, Windows, UE58]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: LFS pull (Python + specs only)
        shell: powershell
        run: |
          git lfs pull --include="specs/**,Content/Python/**"

      - name: Validate echo manifest
        shell: powershell
        run: |
          python Tools/echo_run.py validate-spec specs/echo_pipeline.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Echo manifest validation failed"
            exit $LASTEXITCODE
          }

      - name: Static gate sweep (headless)
        shell: powershell
        continue-on-error: false
        run: |
          $ErrorActionPreference = "Continue"
          $failed = 0
          python Tools/bp_live_path.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          python Tools/graph_reachability.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          python Tools/ui_style_audit.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          python Tools/bp_sweep.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          if ($failed -gt 0) {
            Write-Host "##[error]Static gates failed: $failed checks"
            exit 1
          }
          Write-Host "Static gates passed."

      - name: LFS budget gate (PR base..head; 50 MB on collab/cursor)
        shell: powershell
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "origin/main" }
          git fetch origin main --depth=50 2>$null
          $limit = 512
          $ref = "${{ github.head_ref }}"
          if ($ref -match '^(collab|cursor|docs)/') { $limit = 50 }
          python Tools/git_safe_push.py --range "$base..HEAD" --limit-mb $limit --check-only
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]LFS batch exceeds $limit MB budget"
            exit $LASTEXITCODE
          }
          python Tools/lfs_health_audit.py --game-paths-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record gate row (artifact only; do not push from CI)
        shell: powershell
        run: |
          python Tools/record_gate.py static_gates pass --note "CI echo_gates.yml ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path Saved/gate_ledger.json) {
            Write-Host "Ledger updated locally in the runner workspace."
          }

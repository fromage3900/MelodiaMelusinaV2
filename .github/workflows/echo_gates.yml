name: Echo Static Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Plugins/**/Source/**'
      - 'Content/Python/**'
      - 'specs/**'
  workflow_dispatch:

jobs:
  static_gates:
    runs-on: [self-hosted, Windows, UE58]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: LFS pull (Python + specs only)
        shell: powershell
        run: |
          git lfs pull --include="specs/**,Content/Python/**"

      - name: Validate echo manifest
        shell: powershell
        run: |
          python Tools/echo_run.py validate-spec specs/echo_pipeline.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Echo manifest validation failed"
            exit $LASTEXITCODE
          }

      - name: Static gate sweep (headless)
        shell: powershell
        continue-on-error: false
        run: |
          $ErrorActionPreference = "Continue"
          $failed = 0
          python Tools/bp_live_path.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          python Tools/graph_reachability.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          python Tools/ui_style_audit.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          python Tools/bp_sweep.py --summary
          if ($LASTEXITCODE -ne 0) { $failed++ }
          if ($failed -gt 0) {
            Write-Host "##[error]Static gates failed: $failed checks"
            exit 1
          }
          Write-Host "Static gates passed."

      - name: LFS budget gate (no >512MB new LFS per change)
        shell: powershell
        run: |
          python Tools/git_safe_push.ps1 -LimitMB 512 -Remote origin -Branch $env:GITHUB_HEAD_REF
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]LFS batch exceeds 512 MB budget"
            exit $LASTEXITCODE
          }

      - name: Record gate row
        shell: powershell
        run: |
          python Tools/record_gate.py static_gates pass --note "CI echo_gates.yml ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --quiet -- Saved/gate_ledger.json
          if ($LASTEXITCODE -ne 0) {
            git config user.name "melodia-ci"
            git config user.email "ci@melodia.local"
            git add Saved/gate_ledger.json
            git commit -m "chore: ledger row static_gates pass (CI ${{ github.sha }})"
            git push origin HEAD:${{ github.head_ref }} || Write-Host "ledger push skipped (head ref may be detached)"
          }

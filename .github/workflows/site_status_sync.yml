name: Sync portfolio status from gate ledger

# Keeps the public portfolio honest by regenerating its status blob from the
# game repo's real gate ledger (Saved/gate_ledger.json). Runs on main and nightly.
# The generator never invents progress.
#
# TOKEN-FREE default: run `.\deploy\sync_site_to_github.ps1` locally.
# Optional secret SITE_SYNC_TOKEN: Action pushes the blob to fromage3900/my-site.
#
# Never put `secrets.*` directly in step `if:` — that has produced 0-job
# workflow failures on this repo. Detect the token via env + step output instead.
on:
  push:
    branches: [main]
    paths:
      - 'Saved/gate_ledger.json'
      - 'Tools/sync_site_status.py'
      - '.github/workflows/site_status_sync.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game repo
        uses: actions/checkout@v7
        with:
          path: game

      - name: Generate status blob
        run: |
          python game/Tools/sync_site_status.py --out game/_site_status.json
          echo "Status blob written to game/_site_status.json"

      - name: Detect SITE_SYNC_TOKEN
        id: token
        env:
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: |
          if [ -n "${SITE_SYNC_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SITE_SYNC_TOKEN not configured — skipping remote my-site push."
            echo "Use deploy/sync_site_to_github.ps1 locally for token-free site deploy."
          fi

      - name: Checkout site repo
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: fromage3900/my-site
          path: site
          token: ${{ secrets.SITE_SYNC_TOKEN }}

      - name: Stage generated status
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir -p site/public/melodia/status
          cp game/_site_status.json site/public/melodia/status/sync_status.json

      - name: Commit & push if changed
        if: steps.token.outputs.present == 'true'
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no status change"
          else
            git config user.name "Melodia Sync"
            git config user.email "sync@melodia.local"
            git commit -m "chore(site): sync status from gate ledger"
            git push
          fi

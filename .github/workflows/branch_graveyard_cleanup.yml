name: One-shot branch graveyard cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    name: Delete verified absorbed branches
    if: ${{ contains(github.event.head_commit.message, '[branch-graveyard-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete verified absorbed/superseded refs
        env:
          BRANCHES: |
            docs/material-save-vs-git-sync-truth-20260923
            fix/echo-lfs-independent-signal-20260923
            fix/echo-main-asset-path-coverage-20260923
            fix/wardrobe-contract-addinstance-token-20260923
            docs/melusina-canon-refresh-20260923
            docs/pi-hermes-universe-foundry-launch-refresh-20260923
            docs/melusina-lookdev-grandmaster-refresh-20260923
            cleanup/closeout-20260922
            docs/accessory-convergence-20260922
            docs/waterhair-bake-polish-20260922
            feature/parked-lane-code-extraction-20260922
            feature/waterhair-bake-staging-20260922
            fix/meadow-cymatics-wiring
            fix/rainbow-meadow-wind-wpo
            docs/canonical-qodana-riderlink-jev-20260922
            docs/production-tool-frontdoor-20260922
            feature/studio-final-convergence-20260921
            integration/universe-foundry-current-main-20260922
            collab/laptop/brooch-sky-20260917
            collab/laptop/eyewear-closeout-20260912
            collab/laptop/study-decor-escher-2026-09-14
            docs/melusina-ue-closeout-plan-v5
            fix/terrain-handoff-clean-20260912
            chore/branch-graveyard-cleanup-20260924
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              if git push origin --delete "$branch"; then
                echo "DELETED $branch"
              else
                echo "FAILED $branch" >&2
                failures=$((failures + 1))
              fi
            else
              echo "ALREADY_ABSENT $branch"
            fi
          done <<< "$BRANCHES"
          if [[ "$failures" -ne 0 ]]; then
            echo "$failures branch deletion(s) failed" >&2
            exit 1
          fi

# pyproject.toml — Python tooling config for Melodia Studio / BS_GodFile
# Covers: ruff (lint + format), pytest, mcp-yaccp.
# Scope: Content/Python/ scripts, deploy/ scripts, tools/ scripts.
# Updated 2026-08-07 as part of project health gate (Scope C).

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "Content/Python/__pycache__/",
    "deploy/surreal_arch/",
    "venv/",
    ".venv/",
    "Tools/__pycache__/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common pitfalls)
    "SIM", # flake8-simplify (simplification)
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long — handled by formatter, UE Python scripts have long lines
    "UP004", # useless __init__ — UE Python sometimes needs explicit __init__
]

[tool.ruff.lint.per-file-ignores]
"Content/Python/run_portfolio_capture.py" = ["F401", "F841"]
"Content/Python/render_exporter.py" = ["F401", "F841"]
"deploy/**/*.py" = ["T201"]  # allow print in deploy scripts
"Content/Python/monolith_skill_check.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["Content/Python", "deploy"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

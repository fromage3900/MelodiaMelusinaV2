; 3 = "Enabled with Stencil". Required by M_PP_StorybookOutline's per-object style
; presets and by UMelodiaRhythmReactivitySubsystem::SetReactiveStencil. At the engine
; default of 1 the stencil buffer does not exist, so stencil writes are silently
; discarded and both features are dead code. Owner-approved 2026-08-01.
r.CustomDepth=3
; 2026-09-14 outline verdict (owner eyes): FXAA (1), NOT TSR/TAA. Fullscreen
; depth-edge ink shimmers under any temporal jitter (TSR 4 and TAA 2 both crawl);
; Borderlands-style world ink needs a non-jittered buffer (UE3 had none; FXAA adds
; none). Proven live: r.AntiAliasingMethod 1 froze the ink. Cost, stated plainly:
; native-res rendering (no TSR upscaling perf) + FXAA's softer image. Persisted
; here so the calm survives restart. Revisit only with a viewport A/B in hand.
; 2026-09-15 correction: r.* console variables are IGNORED under RendererSettings;
; the live line now sits under [ConsoleVariables] below (same verdict, working shelf).
; 2026-09-15 Task-1 verdict: r.DefaultFeature.AntiAliasing names NO registered cvar
; (engine source: RendererSettings.h:866) — the real delivery is this UPROPERTY,
; which exports to r.AntiAliasingMethod. 1=FXAA (SceneUtils.h: EAntiAliasingMethod).
DefaultFeatureAntiAliasing=1
; Motion capture validation on 2026-08-01 isolated the severe full-frame streaking
; to the engine motion-blur lane. The PPV outline/view-rect path remained clean at
; mismatched 1920x1080 capture resolution. Keep gameplay and portfolio movement
; crisp by default; authored cinematics may opt in locally when explicitly needed.
r.DefaultFeature.MotionBlur=False

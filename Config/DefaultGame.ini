+DirectoriesToAlwaysCook=(Path="/Game/MelodiaIntegration/Narrative")
; The dedicated front end resolves WBP_MainMenu, WBP_SaveLoadPanel, settings,
; and the opening presentation through native soft paths at BeginPlay. Keep the
; project-owned UI family in the packaged dependency graph; PIE/editor loads can
; hide this omission because the editor can resolve uncooked content on disk.
; (2026-08-14: packaged Gauntlet proved WBP_MainMenu was absent from IoStore.)
+DirectoriesToAlwaysCook=(Path="/Game/Melodia/UI")
; Party/ must be force-cooked: BP_SirMelodiousPlayerUnit is loaded at runtime by
; a hardcoded LoadClass path in MelodiaJRPGPartyBootstrapSubsystem, so nothing
; references it statically. Without this line it is not cooked, LoadClass returns
; null in a packaged build, and Sir silently never joins the party -- the only
; symptom being a "waiting for the authored BP_SirMelodiousPlayerUnit asset"
; warning. Works fine in PIE, which is what makes it dangerous. (2026-08-08)
+DirectoriesToAlwaysCook=(Path="/Game/MelodiaIntegration/Party")

; Cook exit 25 (2026-07-30): resolved by quarantining five damaged assets to
; _QuarantineAssets_20260730/, not by blacklisting a directory here.
;
; A +DirectoriesToNeverCook=(Path="/PCGExtendedToolkit") entry was tried first and
; REMOVED: blacklisting a plugin path collides with that plugin's own asset
; reference domain, raising "Registered the path /PCGExtendedToolkit/ for two
; different domains" as a handled ensure. The cook tallies that as ~13 errors and
; fails on any error count, so it traded one fatal assert for a failing tally.
; Do not re-add it.


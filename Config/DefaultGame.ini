; The dedicated front end resolves WBP_MainMenu, WBP_SaveLoadPanel, settings,
; and the opening presentation through native soft paths at BeginPlay. Keep the
; project-owned UI family in the packaged dependency graph; PIE/editor loads can
; hide this omission because the editor can resolve uncooked content on disk.
; (2026-08-14: packaged Gauntlet proved WBP_MainMenu was absent from IoStore.)
+DirectoriesToAlwaysCook=(Path="/Game/Melodia/UI")
; Party/ must be force-cooked: BP_SirMelodiousPlayerUnit is loaded at runtime by
; a hardcoded LoadClass path in MelodiaJRPGPartyBootstrapSubsystem, so nothing
; references it statically. Without this line it is not cooked, LoadClass returns
; null in a packaged build, and Sir silently never joins the party -- the only
; symptom being a "waiting for the authored BP_SirMelodiousPlayerUnit asset"
; warning. Works fine in PIE, which is what makes it dangerous. (2026-08-08)
+DirectoriesToAlwaysCook=(Path="/Game/MelodiaIntegration/Party")

; The packaged build BOOTS but the ROUTE cannot run without these (2026-09-03).
; Verified from the packaged runtime log of the P0_Closeout_20260902 archive:
;   LogTemp: Error: Melodia integration config is missing:
;            /Game/MelodiaIntegration/Config/DA_MelodiaIntegrationConfig
;   LogTemp: Error: Melodia Persona content is missing:
;            /Game/MelodiaIntegration/Config/DA_MelodiaPersonaContent
;   LogTemp: Error: MELODIA_MUSICCLOCK required beat-grid MIDI is missing:
;            /Game/MelodiaIntegration/MIDI/128BPMarpeggiomelody_beatgrid
; All three exist on disk; nothing referenced them in a way the cooker followed,
; so they were never staged. The missing beat-grid is ALSO why BeatPulse reads
; zero at runtime -- UMelodiaAudioReactivePresentationSubsystem gates BeatPulse on
; bHasMusicalTime, and with no beat grid there is no musical time.
+DirectoriesToAlwaysCook=(Path="/Game/MelodiaIntegration/Config")
+DirectoriesToAlwaysCook=(Path="/Game/MelodiaIntegration/MIDI")

; Cook exit 25 (2026-07-30): resolved by quarantining five damaged assets to
; _QuarantineAssets_20260730/, not by blacklisting a directory here.
;
; A +DirectoriesToNeverCook=(Path="/PCGExtendedToolkit") entry was tried first and
; REMOVED: blacklisting a plugin path collides with that plugin's own asset
; reference domain, raising "Registered the path /PCGExtendedToolkit/ for two
; different domains" as a handled ensure. The cook tallies that as ~13 errors and
; fails on any error count, so it traded one fatal assert for a failing tally.
; Do not re-add it.

; Cook exit 25 (2026-09-02): /MeshPartition/DataAssets/MPD_Default failed with
; "imports class /Script/MeshPartition.MeshPartitionDefinition, which is in a
; module that is not available on the platform." MeshPartition is an engine
; Experimental plugin already scoped TargetAllowList=["Editor"] in the .uproject,
; but the cook commandlet runs INSIDE the editor (where the plugin is enabled) and
; enumerates its content anyway. One error fails the whole cook.
;
; This IS the blacklist the PCGExtendedToolkit note above warns against, and the
; distinction matters: that collision arose because project content genuinely
; references /PCGExtendedToolkit/, so blacklisting split one asset domain in two.
; Nothing under Content/ references MeshPartition (verified 2026-09-02 by grep over
; *.uasset); the only references are editor-only source
; (Source/BS_GodFile/PCG/PCGScaleWorldEditorLibrary.*, BS_GodFile.Build.cs).
; With no project-side referencer there is no second domain to collide with.
; If a two-domain ensure tally appears anyway, revert this and quarantine the
; engine asset instead.
; VERDICT 2026-09-02: TRIED AND REVERTED. It reproduced the exact PCGExtendedToolkit
; failure: "Registered the path /MeshPartition/ for two different domains:
; Plugin:MeshPartition and Never Cooked Content". The two domains are the ENABLED
; PLUGIN itself and the NeverCook entry -- whether project content references the
; plugin is irrelevant. The cook body completed ("Finalisation: End / Done!") but the
; handled ensure landed in the Warning/Error Summary and UAT failed on the tally.
; Resolved instead by quarantining the engine asset (see ARTDROP/quarantine runbook).
; DO NOT re-add a NeverCook entry for ANY enabled plugin path.


; DefaultScalability.ini — Epic-quality render lock for portfolio capture and beauty shots.
; Matches DefaultEngine.ini's HardwareTargetingSettings (DefaultGraphicsPerformance=Maximum).
; Prevents auto-downgrade on headless/virtual machines.

[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=4
sg.AntiAliasingQuality=4
sg.ShadowQuality=4
sg.GlobalIlluminationQuality=4
sg.ReflectionQuality=4
sg.PostProcessQuality=4
sg.TextureQuality=4
sg.EffectsQuality=4
sg.FoliageQuality=4
sg.ShadingQuality=4

[ScalabilityPreview]
ScalabilityPreviewQualityLevel=4

[/Script/Engine.GameUserSettings]
VisualEffectQuality=4
TextureQuality=4
ShadowQuality=4
ReflectionQuality=4
AntiAliasingQuality=4
ShadingQuality=4
PostProcessQuality=4
ViewDistanceQuality=4
FoliageQuality=4

; Lock resolution scale to 100% (no TSR upscale from lower res)
[ResolutionQuality]
sg.ResolutionQuality=100
